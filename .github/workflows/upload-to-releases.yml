name: Upload Video to Releases

on:
  workflow_run:
    workflows: ["Render Video"]
    types:
      - completed

jobs:
  upload-to-releases:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
    - name: Download artifacts from workflow run
      uses: actions/download-artifact@v4
      with:
        pattern: rendered-video-*
        merge-multiple: true
        path: ./videos
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: ${{ github.event.workflow_run.id }}

    - name: List downloaded files
      run: |
        echo "Downloaded files:"
        find ./videos -type f -name "*.mp4" -exec ls -la {} \;

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: ./videos/*.mp4
        tag_name: video-${{ github.event.workflow_run.run_number }}
        name: "Video Render ${{ github.event.workflow_run.run_number }}"
        body: |
          Rendered automatically via GitHub Actions.

          - Workflow Run: #${{ github.event.workflow_run.run_number }}
          - Triggered by: ${{ github.event.workflow_run.event }}
          - Completed at: ${{ github.event.workflow_run.updated_at }}

          Format: MP4 (H.264). See the artifact filename for the composition ID.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Comment on workflow run
      uses: actions/github-script@v7
      with:
        script: |
          const workflowRun = context.payload.workflow_run;
          console.log(`Video uploaded to releases for run #${workflowRun.run_number}`);
          console.log(`Tag: video-${workflowRun.run_number}`);
