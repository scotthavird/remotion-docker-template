name: Render Video

on:
  workflow_dispatch:
    inputs:
      composition_id:
        description: 'Composition to render'
        required: true
        default: 'HelloWorld'
        type: choice
        options:
          - HelloWorld
          - TransitionsDemo
          - CaptionsDemo
      title:
        description: 'HelloWorld: video title'
        required: false
        default: 'Hello World'
        type: string
      subtitle:
        description: 'HelloWorld: video subtitle'
        required: false
        default: 'Welcome to Remotion'
        type: string
      content_header:
        description: 'HelloWorld: content section header'
        required: false
        default: 'Discover More'
        type: string
      outro_message:
        description: 'HelloWorld: outro message'
        required: false
        default: 'Thank You!'
        type: string
      scene_one_text:
        description: 'TransitionsDemo: scene 1 text'
        required: false
        default: 'Welcome'
        type: string
      scene_two_text:
        description: 'TransitionsDemo: scene 2 text'
        required: false
        default: 'Built with Remotion'
        type: string
      scene_three_text:
        description: 'TransitionsDemo: scene 3 text'
        required: false
        default: 'Render Anywhere'
        type: string
      srt_path:
        description: 'CaptionsDemo: SRT path under public/'
        required: false
        default: 'captions/sample.srt'
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  render-video:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Create output directory
      run: mkdir -p ./output

    - name: Run video render container
      run: |
        docker run --rm \
          -v $(pwd)/output:/usr/src/app/out \
          -v $(pwd)/public:/usr/src/app/public \
          -e COMPOSITION_ID="${{ github.event.inputs.composition_id }}" \
          -e TITLE="${{ github.event.inputs.title }}" \
          -e SUBTITLE="${{ github.event.inputs.subtitle }}" \
          -e CONTENT_HEADER="${{ github.event.inputs.content_header }}" \
          -e OUTRO_MESSAGE="${{ github.event.inputs.outro_message }}" \
          -e SCENE_ONE_TEXT="${{ github.event.inputs.scene_one_text }}" \
          -e SCENE_TWO_TEXT="${{ github.event.inputs.scene_two_text }}" \
          -e SCENE_THREE_TEXT="${{ github.event.inputs.scene_three_text }}" \
          -e SRT_PATH="${{ github.event.inputs.srt_path }}" \
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main

    - name: List output files
      run: ls -la ./output/

    - name: Upload video as artifact
      uses: actions/upload-artifact@v4
      with:
        name: rendered-video-${{ github.event.inputs.composition_id }}
        path: ./output/
        retention-days: 30

    - name: Create release with video
      if: github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v1
      with:
        files: ./output/*.mp4
        tag_name: video-${{ github.run_number }}
        name: "${{ github.event.inputs.composition_id }} #${{ github.run_number }}"
        body: |
          Composition: **${{ github.event.inputs.composition_id }}**

          Inputs:
          - title: ${{ github.event.inputs.title }}
          - subtitle: ${{ github.event.inputs.subtitle }}
          - content_header: ${{ github.event.inputs.content_header }}
          - outro_message: ${{ github.event.inputs.outro_message }}
          - scene_one_text: ${{ github.event.inputs.scene_one_text }}
          - scene_two_text: ${{ github.event.inputs.scene_two_text }}
          - scene_three_text: ${{ github.event.inputs.scene_three_text }}
          - srt_path: ${{ github.event.inputs.srt_path }}

          Rendered at: ${{ github.event.head_commit.timestamp }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
